<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Anmelden – Mailform</title>
<link rel="stylesheet" href="/app.css" />
<script type="module" src="/login.js"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="airmail" aria-hidden="true"></div>
      <div class="inner">
        <div class="brand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6" stroke-linecap="round"/></svg>
          Mailform
        </div>
        <form id="login">
          <div class="field">
            <label for="username">Benutzername</label>
            <input class="input" id="username" autocomplete="username" autocapitalize="none" required autofocus />
          </div>
          <div class="field">
            <label for="password">Passwort</label>
            <input class="input" id="password" type="password" autocomplete="current-password" required />
          </div>
          <div id="err" role="alert"></div>
          <button class="btn btn-primary" id="submit" type="submit">Anmelden</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
